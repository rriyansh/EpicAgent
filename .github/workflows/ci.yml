name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: epic
          POSTGRES_PASSWORD: epic
          POSTGRES_DB: epic_agent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U epic -d epic_agent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Lint backend
        run: cd backend && npm run lint

      - name: Lint frontend
        run: cd frontend && npm run lint

      - name: Build backend
        run: cd backend && npm run build
        env:
          DATABASE_URL: postgresql://epic:epic@localhost:5432/epic_agent
          JWT_SECRET: test-secret
          ENCRYPTION_KEY: test-encryption-key-32-chars

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Run migrations
        run: cd backend && npm run migrate
        env:
          DATABASE_URL: postgresql://epic:epic@localhost:5432/epic_agent

      - name: Test
        run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          load: true
          tags: epic-agent-backend:test

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          load: true
          tags: epic-agent-frontend:test
